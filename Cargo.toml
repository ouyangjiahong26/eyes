[package]
name = "eyes"
version = "0.4.7"
edition = "2021"
default-run = "eyes"
description = "桌面坐姿监测与护眼提醒工具"
authors = ["cislunarspace <cislunarspace@users.noreply.github.com>"]
# cargo-rpm 反序列化要求此字段（仓库里无 LICENSE 文件，但 cargo-rpm
# 不要求 LICENSE 实际存在，仅要求字段声明）。
license = "MIT"

# cargo-wix 配置。`cargo wix` 读取此节生成 MSI。
# 完整字段见 https://volans-.github.io/cargo-wix/
[package.metadata.wix]
# 安装包显示名（控制面板、开始菜单）。
product-name = "Eyes"
# 控制面板「发布者」字段。
manufacturer = "cislunarspace"
# 安装后 exe 名称。
upgrade-code-guid = "B7E0F4A2-3C5D-4E6B-9F8A-1D2C3E4F5A6B"



[lib]
name = "eyes_lib"
# Bevy 编译需要 rlib；cdylib 暂不需要。
crate-type = ["rlib"]

[features]
# 默认不启用摄像头和检测器；构建快，CI 也能跑。
default = []
opencv-camera = ["dep:opencv"]
onnx-detector = ["dep:ort", "dep:nalgebra"]

[dependencies]
# Bevy 桌面引擎。应用启动时用 DefaultPlugins 创建原生窗口；
# 默认 features 包含渲染、winit、窗口等，能直接弹出一个空白窗口。
# 后续如需缩减编译时间可裁剪 features。
#
# 声音提醒：禁用默认的 `bevy_audio`/`vorbis`。bevy_kira_audio 与 bevy 自带音频插件
# 冲突（两者都注册 Audio 资源），必须关掉前者改用 kira。下面显式列回除音频外
# 的全部默认 feature，保证其余行为不变。
bevy = { version = "0.15", default-features = false, features = [
    "android-game-activity",
    "android_shared_stdcxx",
    "animation",
    "bevy_asset",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_gilrs",
    "bevy_gizmos",
    "bevy_gltf",
    "bevy_mesh_picking_backend",
    "bevy_pbr",
    "bevy_picking",
    "bevy_render",
    "bevy_scene",
    "bevy_sprite",
    "bevy_sprite_picking_backend",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_picking_backend",
    "bevy_window",
    "bevy_winit",
    "custom_cursor",
    "default_font",
    "hdr",
    "multi_threaded",
    "png",
    "smaa_luts",
    "sysinfo_plugin",
    "tonemapping_luts",
    "webgl2",
    "x11",
] }
tray-icon = "0.24"
auto-launch = "0.6"
notify-rust = "4"

# 声音提醒。bevy_kira_audio 通过 kira 播放 wav；
# kira 版本须与 bevy_kira_audio 0.22 内置的 0.9.6 对齐，直接引用以构造
# StaticSoundData（从嵌入的 wav 字节解码）。
bevy_kira_audio = { version = "0.22", default-features = false, features = ["wav"] }
kira = { version = "0.9", default-features = false, features = ["cpal", "wav"] }

# 序列化（domain 配置、事件、previews）
base64 = "0.22"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 运行时 config.yaml 读写。
serde_yaml = "0.9"
# 编译期内嵌 i18n 翻译表（zh.toml / en.toml）解析。
toml = "0.8"

# 后端基础
dirs = "6"

# 摄像头与检测器（feature-gated）
opencv = { version = "0.99", optional = true }
ort = { version = "=2.0.0-rc.12", optional = true }
nalgebra = { version = "0.33", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Shell_PropertiesSystem",
] }

# tray-icon 在 Linux 上要 GTK 主循环；因为 Bevy 主线程跑 winit，
# 托盘必须在自己的线程里 init + main，所以这里直接用 gtk crate。
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[dev-dependencies]
tempfile = "3"

# ── Linux 打包（cargo bundle）─────────────────────────────────────
# `cargo bundle --format deb` / `--format rpm` 读取以下配置产出 Linux 包。
# 工具本身需单独安装：cargo install cargo-bundle
[package.metadata.bundle]
name = "eyes"
identifier = "com.cislunarspace.eyes"
category = "Utility"
short_description = "桌面坐姿监测与护眼提醒工具"
long_description = "通过摄像头监测头部姿态，提醒你保持正确坐姿、适时休息。"
# 随可执行文件分发的资源目录：
#   models/ — ONNX 检测模型（见 models/MANIFEST.toml）
#   lib/    — ONNX Runtime 动态库（.so），由发布脚本在打包前从 ort 构建产物暂存到此目录
# OpenCV 不打包：Linux 包声明依赖系统 libopencv（见 build.rs 的 pkg-config 校验）。
resources = ["models", "lib"]
# Linux 包运行时依赖（cargo-bundle 在生成 .deb 时写入 control 字段 Depends）。
# libc6 兜底：deb 构建机可能默认装旧版 glibc。
# opencv 子包命名遵循 Debian 12+/Ubuntu 24.04 约定：<module>406t64
#   406 = OpenCV 4.6 主版本号，dot-to-0 转换
#   t64 = time_t 64-bit 过渡后缀（Debian 12+ 引入）
# ldd target/release/eyes 链接的子包：core / imgproc / imgcodecs / videoio。
# 其余 opencv 子库（calib3d、dnn、flann 等）由这 4 个间接依赖拉入。
# fonts-noto-cjk：Linux 字体加载依赖（src/lib.rs::load_system_cjk_font 的 CANDIDATES
#   首选项），无此包则中文字符显示为 tofu（方块）。Ubuntu 24.04 桌面默认装，server 需手动。
deb_depends = [
    "libc6 (>= 2.31)",
    "libopencv-core406t64",
    "libopencv-imgproc406t64",
    "libopencv-imgcodecs406t64",
    "libopencv-videoio406t64",
    "fonts-noto-cjk",
]

# ── Linux RPM 打包（cargo-rpm）────────────────────────────────────
# `cargo rpm build` 读取以下配置产出 .rpm 包。
# 工具本身需单独安装：cargo install cargo-rpm
# 字段语义见 cargo-rpm 源码 src/config.rs：
#   [package.metadata.rpm]           —— 包名覆盖
#   [package.metadata.rpm.targets]   —— 二进制目标，键名=crate 二进制名，path=安装绝对路径
#   [package.metadata.rpm.files]     —— 额外文件，键名=文件名，path=安装绝对路径
# 注意：files 段的文件源不在 Cargo.toml 里——cargo-rpm 期望它们位于 .rpm/ 目录下。
# 打包前需把 models/MANIFEST.toml 等资源先 cp 到 .rpm/，由发布脚本（task-Z 之后）完成。
# name / version / release / summary / description / license 不在此处声明，
# 一律从 [package] 段读取——所以上面补的 description / version 在此自动复用。
[package.metadata.rpm]
package = "eyes"

# 默认二进制目标：cargo-rpm 从 target/release/eyes（路径由其内部探测）拷贝到 /usr/bin/eyes。
[package.metadata.rpm.targets]
eyes = { path = "/usr/bin/eyes" }

# 资源文件：ONNX 模型与清单随包分发到 /usr/lib/eyes/models/。
# 文件本身需提前放到 .rpm/ 目录下同名的文件，cargo-rpm 按键名匹配。
[package.metadata.rpm.files]
"face_detection_yunet_2023mar.onnx" = { path = "/usr/lib/eyes/models/face_detection_yunet_2023mar.onnx" }
"MANIFEST.toml" = { path = "/usr/lib/eyes/models/MANIFEST.toml" }

[profile.release]
opt-level = 2
